<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#0d0d10"/>
  
  <!-- Stencil-style urban background blocks -->
  <polygon points="18,28 238,18 242,238 22,232" fill="#e8e2d0" opacity="0.06"/>
  <polygon points="28,38 228,28 232,228 32,222" fill="#ff6a1a" opacity="0.05"/>
  
  <!-- Base spray paint can body - chunky diagonal silhouette -->
  <path d="M78 92 L148 72 L172 178 L102 198 Z" fill="#0d0d10" stroke="#e8e2d0" stroke-width="4"/>
  <path d="M78 92 L148 72 L152 90 L82 110 Z" fill="#e8e2d0"/>
  
  <!-- Can top rim -->
  <path d="M74 86 L152 62 L158 82 L80 106 Z" fill="#e8e2d0"/>
  
  <!-- Can bottom rim -->
  <path d="M100 192 L170 172 L174 190 L104 210 Z" fill="#e8e2d0" opacity="0.7"/>
  
  <!-- Nozzle - tilted downward toward the right -->
  <path d="M140 64 L162 58 L168 72 L146 78 Z" fill="#e8e2d0"/>
  <path d="M160 56 L176 52 L180 64 L164 68 Z" fill="#ff6a1a"/>
  
  <!-- Spray emission - jagged neon code brackets -->
  <!-- Left bracket { -->
  <polyline points="182,72 198,86 186,102 200,118 186,134 200,150 182,164" 
            fill="none" stroke="#39ff88" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
  
  <!-- Right bracket } -->
  <polyline points="218,80 204,96 216,112 202,128 216,144 202,160 218,174" 
            fill="none" stroke="#39ff88" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
  
  <!-- Neon spray particles / code flecks -->
  <rect x="192" y="76" width="4" height="4" fill="#39ff88"/>
  <rect x="212" y="92" width="3" height="3" fill="#39ff88"/>
  <rect x="188" y="140" width="4" height="4" fill="#39ff88"/>
  <rect x="210" y="156" width="3" height="3" fill="#ff6a1a"/>
  <rect x="196" y="168" width="3" height="3" fill="#39ff88"/>
  
  <!-- Slight gritty noise specks -->
  <rect x="108" y="138" width="3" height="3" fill="#e8e2d0" opacity="0.3"/>
  <rect x="130" y="150" width="2" height="2" fill="#e8e2d0" opacity="0.25"/>
  <rect x="116" y="160" width="3" height="3" fill="#e8e2d0" opacity="0.2"/>
  <rect x="142" y="130" width="2" height="2" fill="#e8e2d0" opacity="0.3"/>
  
  <!-- Stencil stripe across can -->
  <path d="M88 128 L158 110 L161 124 L91 142 Z" fill="#ff6a1a" opacity="0.8"/>
  
  <!-- Small wordmark -->
  <text x="68" y="244" font-family="monospace" font-size="11" font-weight="bold" 
        fill="#e8e2d0" letter-spacing="2" text-anchor="start" opacity="0.6">DAHOOD-SCRIPTS</text>
</svg>
